<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Mata Kuliah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="kartu">
        <h1>Registrasi Mata Kuliah</h1>

        <form id="formRegistrasi" novalidate>
            <!-- Nama Mahasiswa -->
            <div class="kolom">
                <label for="nama">Nama Mahasiswa</label>
                <div class="bungkus">
                    <input type="text" id="nama" autocomplete="off" placeholder="Ketik nama anda">
                    <ul id="saranNama" class="saran" hidden></ul>
                </div>
                <small class="error" id="errorNama"></small>
            </div>

            <!-- NRP -->
            <div class="kolom">
                <label for="nrp">NRP</label>
                <input type="text" id="nrp" placeholder="Masukkan NRP (10 digit angka)">
                <small class="error" id="errorNrp"></small>
            </div>

            <!-- Email -->
            <div class="kolom">
                <label for="email">Email Mahasiswa</label>
                <input type="email" id="email" placeholder="contoh: nama@domain.com">
                <small class="error" id="errorEmail"></small>
            </div>

            <!-- Password -->
            <div class="kolom">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter">
                <small class="error" id="errorPassword"></small>
            </div>

            <!-- Mata Kuliah -->
            <div class="kolom">
                <label for="matkul">Mata Kuliah</label>
                <div class="bungkus dropdown">
                    <input type="text" id="matkul" autocomplete="off" placeholder="Pilih atau ketik nama mata kuliah">
                    <ul id="saranMatkul" class="saran" hidden></ul>
                </div>
                <small class="error" id="errorMatkul"></small>
            </div>

            <!-- Dosen -->
            <div class="kolom">
                <label for="dosen">Dosen</label>
                <div class="bungkus dropdown">
                    <input type="text" id="dosen" autocomplete="off" placeholder="Pilih mata kuliah terlebih dahulu" disabled>
                    <ul id="saranDosen" class="saran" hidden></ul>
                </div>
                <small class="error" id="errorDosen"></small>
            </div>

            <!-- Persetujuan -->
            <div class="kolom">
                <label class="inline">
                    <input type="checkbox" id="setuju"> Saya menyetujui data di atas
                </label>
                <small class="error" id="errorSetuju"></small>
            </div>

            <!-- Tombol Aksi -->
            <div class="tombol">
                <button type="submit">Daftar</button>
                <button type="reset" class="sekunder">Reset</button>
            </div>
        </form>

        <div id="hasil" hidden></div>

        <!-- Tabel Pendaftar -->
        <section class="terdaftar">
            <h2>Sudah terdaftar (<span id="jumlah">0</span>)</h2>
            <p id="kosong">Belum ada yang terdaftar.</p>
            <table id="tabel" hidden>
                <thead>
                    <tr>
                        <th>Nama</th>
                        <th>NRP</th>
                        <th>Email</th>
                        <th>Mata Kuliah</th>
                        <th>Dosen</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="isiTabel"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
